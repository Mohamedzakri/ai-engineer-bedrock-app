[project]
name = "helpdesk"
version = "0.1.0"
description = "Helpdesk + knowledge base: a 12-factor FastAPI modular monolith with AI features (RAG, agents, MCP)"
readme = "README.md"
authors = [
    { name = "Mohamed Zakri" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "fastapi[standard]>=0.162.2",
    "psycopg[binary]>=3.3.9",
    "sqlalchemy>=2.1.8",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
